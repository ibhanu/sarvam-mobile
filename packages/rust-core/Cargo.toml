[package]
name = "sarvam-rust-core"
version = "0.2.0"
edition = "2021"
description = "Shared cross-platform Rust core engine for Sarvam AI Mobile SDKs (Auth, Retry/Backoff, SSE/WS State Machines, 16kHz PCM Audio DSP, and C-FFI/JNI/Wasm bindings)"
license = "MIT"
repository = "https://github.com/ibhanu/sarvam-mobile"

[lib]
name = "sarvam_rust_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
