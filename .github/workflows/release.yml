name: Release & Publish Packages

on:
  push:
    branches: [main]
    tags:
      - 'v*'
      - '*-v*'
      - 'packages/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (validate build and packaging without publishing)'
        required: true
        type: boolean
        default: false
      target:
        description: 'Target registry to publish'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - npm
          - maven
          - dart
          - swift
          - rust

permissions:
  contents: write
  pull-requests: write
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please (Automated Versioning & Changelogs)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      rust_core_created: ${{ steps.release.outputs['packages/rust-core--release_created'] }}
      rust_core_version: ${{ steps.release.outputs['packages/rust-core--version'] }}
      rust_core_tag: ${{ steps.release.outputs['packages/rust-core--tag_name'] }}
      ts_core_created: ${{ steps.release.outputs['packages/ts-core--release_created'] }}
      ts_core_version: ${{ steps.release.outputs['packages/ts-core--version'] }}
      ts_core_tag: ${{ steps.release.outputs['packages/ts-core--tag_name'] }}
      react_native_created: ${{ steps.release.outputs['packages/react-native--release_created'] }}
      react_native_version: ${{ steps.release.outputs['packages/react-native--version'] }}
      react_native_tag: ${{ steps.release.outputs['packages/react-native--tag_name'] }}
      kotlin_created: ${{ steps.release.outputs['packages/kotlin--release_created'] }}
      kotlin_version: ${{ steps.release.outputs['packages/kotlin--version'] }}
      kotlin_tag: ${{ steps.release.outputs['packages/kotlin--tag_name'] }}
      dart_created: ${{ steps.release.outputs['packages/dart/sarvam--release_created'] }}
      dart_version: ${{ steps.release.outputs['packages/dart/sarvam--version'] }}
      dart_tag: ${{ steps.release.outputs['packages/dart/sarvam--tag_name'] }}
      dart_audio_created: ${{ steps.release.outputs['packages/dart/sarvam_flutter_audio--release_created'] }}
      dart_audio_version: ${{ steps.release.outputs['packages/dart/sarvam_flutter_audio--version'] }}
      swift_created: ${{ steps.release.outputs['packages/swift--release_created'] }}
      swift_version: ${{ steps.release.outputs['packages/swift--version'] }}
      swift_tag: ${{ steps.release.outputs['packages/swift--tag_name'] }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Google Release Please Action
        uses: googleapis/release-please-action@v5
        id: release
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Auto-Sync Versions & Enable Auto-Merge on Release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --head release-please--branches--main --json number --jq '.[0].number')
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            echo "Found open Release Please PR #$PR_NUMBER. Syncing documentation versions..."
            git checkout release-please--branches--main || git checkout -b release-please--branches--main origin/release-please--branches--main
            node scripts/sync-readme-versions.mjs
            if [ -n "$(git status --porcelain)" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git commit -am "chore: sync README version references"
              git push origin release-please--branches--main
            fi
            echo "Enabling auto-merge on Release PR #$PR_NUMBER..."
            gh pr merge "$PR_NUMBER" --auto --squash --delete-branch || echo "Auto-merge already enabled or not applicable."
          else
            echo "No open Release Please PR found."
          fi

  publish-npm:
    name: Publish npm Packages (@sarvam-mobile/core & @sarvam-mobile/react-native)
    needs: release-please
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    if: |
      !failure() && !cancelled() && (
        (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'npm')) ||
        (startsWith(github.ref, 'refs/tags/') && (
          startsWith(github.ref, 'refs/tags/v') ||
          startsWith(github.ref, 'refs/tags/npm-') ||
          startsWith(github.ref, 'refs/tags/ts-') ||
          contains(github.ref, 'react-native') ||
          contains(github.ref, 'ts-core')
        )) ||
        needs.release-please.outputs.ts_core_created == 'true' ||
        contains(needs.release-please.outputs.paths_released, 'packages/ts-core') ||
        needs.release-please.outputs.react_native_created == 'true' ||
        contains(needs.release-please.outputs.paths_released, 'packages/react-native')
      )
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm CLI to latest (Required for Trusted Publishing OIDC >= 11.5.1)
        run: npm install -g npm@latest

      - name: Verify npm CLI Version
        run: npm --version

      - name: Install dependencies & Build all TypeScript / RN SDKs
        run: |
          npm install
          npm run build

      - name: Dry-run Publish npm Packages
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          echo "Executing npm dry-run publish for @sarvam-mobile/core..."
          cd packages/ts-core
          npm publish --dry-run || echo "Dry-run validated (package version may already exist on npm)."
          echo "Executing npm dry-run publish for @sarvam-mobile/react-native..."
          cd ../react-native
          npm publish --dry-run || echo "Dry-run validated (package version may already exist on npm)."

      - name: Live Publish npm Packages
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          fi
          TAG_VER=""
          if [[ "${{ github.ref }}" =~ refs/tags/.*-v([0-9]+\.[0-9]+\.[0-9]+.*) ]] || [[ "${{ github.ref }}" =~ refs/tags/v([0-9]+\.[0-9]+\.[0-9]+.*) ]]; then
            TAG_VER="${BASH_REMATCH[1]}"
          fi

          echo "Publishing @sarvam-mobile/core..."
          cd packages/ts-core
          if [ -n "$TAG_VER" ] && [[ "${{ github.ref }}" =~ (ts|npm|v[0-9]|packages/ts-core) ]]; then
            npm version "$TAG_VER" --no-git-tag-version --allow-same-version || true
          fi
          CORE_VER=$(node -p "require('./package.json').version")
          if npm view "@sarvam-mobile/core@$CORE_VER" version >/dev/null 2>&1; then
            echo "@sarvam-mobile/core@$CORE_VER already exists on npm. Skipping."
          else
            npm publish --access public --provenance || npm publish --access public
          fi

          echo "Publishing @sarvam-mobile/react-native..."
          cd ../react-native
          if [ -n "$TAG_VER" ] && [[ "${{ github.ref }}" =~ (react-native|npm|v[0-9]|packages/react-native) ]]; then
            npm version "$TAG_VER" --no-git-tag-version --allow-same-version || true
          fi
          RN_VER=$(node -p "require('./package.json').version")
          if npm view "@sarvam-mobile/react-native@$RN_VER" version >/dev/null 2>&1; then
            echo "@sarvam-mobile/react-native@$RN_VER already exists on npm. Skipping."
          else
            npm publish --access public --provenance || npm publish --access public
          fi

  publish-dart:
    name: Dispatch pub.dev Tag Publishing
    needs: release-please
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    if: |
      !failure() && !cancelled() && (
        (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'dart')) ||
        (startsWith(github.ref, 'refs/tags/') && (
          startsWith(github.ref, 'refs/tags/v') ||
          startsWith(github.ref, 'refs/tags/dart-') ||
          contains(github.ref, 'packages/dart')
        )) ||
        needs.release-please.outputs.dart_created == 'true' ||
        contains(needs.release-please.outputs.paths_released, 'packages/dart/sarvam') ||
        needs.release-please.outputs.dart_audio_created == 'true' ||
        contains(needs.release-please.outputs.paths_released, 'packages/dart/sarvam_flutter_audio')
      )
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Dry-run Publish Dart Core Package (sarvam)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          cd packages/dart/sarvam
          dart pub get
          dart pub publish --dry-run

      - name: Dry-run Publish Flutter Companion Audio Package (sarvam_flutter_audio)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          cd packages/dart/sarvam_flutter_audio
          flutter pub get
          flutter pub publish --dry-run

      - name: Dispatch Tag Publish for Dart Core Package
        if: |
          (github.event_name != 'workflow_dispatch' || !inputs.dry_run) &&
          (needs.release-please.outputs.dart_created == 'true' || contains(needs.release-please.outputs.paths_released, 'packages/dart/sarvam') || inputs.target == 'all' || inputs.target == 'dart')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release-please.outputs.dart_tag }}"
          if [ -z "$TAG" ]; then
            TAG="dart-v$(grep '^version:' packages/dart/sarvam/pubspec.yaml | head -n1 | awk '{print $2}')"
          fi
          echo "Dispatching publish-dart.yml on tag $TAG..."
          gh workflow run publish-dart.yml --ref "refs/tags/$TAG" || gh workflow run publish-dart.yml

      - name: Dispatch Tag Publish for Flutter Companion Audio Package
        if: |
          (github.event_name != 'workflow_dispatch' || !inputs.dry_run) &&
          (needs.release-please.outputs.dart_audio_created == 'true' || contains(needs.release-please.outputs.paths_released, 'packages/dart/sarvam_flutter_audio') || inputs.target == 'all' || inputs.target == 'dart')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release-please.outputs.dart_audio_tag }}"
          if [ -z "$TAG" ]; then
            TAG="dart-audio-v$(grep '^version:' packages/dart/sarvam_flutter_audio/pubspec.yaml | head -n1 | awk '{print $2}')"
          fi
          echo "Dispatching publish-dart.yml on tag $TAG..."
          gh workflow run publish-dart.yml --ref "refs/tags/$TAG" || gh workflow run publish-dart.yml

  publish-maven:
    name: Publish Kotlin & Android Artifacts (Maven Central)
    needs: release-please
    timeout-minutes: 15
    if: |
      !failure() && !cancelled() && (
        (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'maven')) ||
        (startsWith(github.ref, 'refs/tags/') && (
          startsWith(github.ref, 'refs/tags/v') ||
          startsWith(github.ref, 'refs/tags/kotlin-') ||
          startsWith(github.ref, 'refs/tags/android-') ||
          contains(github.ref, 'packages/kotlin')
        )) ||
        needs.release-please.outputs.kotlin_created == 'true' ||
        contains(needs.release-please.outputs.paths_released, 'packages/kotlin')
      )
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build & Publish to Staging / Local Repository
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          cd packages/kotlin
          GRADLE_ARGS=""
          if [[ "${{ github.ref }}" =~ refs/tags/.*-v([0-9]+\.[0-9]+\.[0-9]+.*) ]] || [[ "${{ github.ref }}" =~ refs/tags/v([0-9]+\.[0-9]+\.[0-9]+.*) ]]; then
            TAG_VER="${BASH_REMATCH[1]}"
            GRADLE_ARGS="-PVERSION_NAME=$TAG_VER"
          fi
          ./gradlew $GRADLE_ARGS publishToMavenLocal publishAllPublicationsToStagingRepository --stacktrace

      - name: Upload Maven Staging Artifacts Bundle
        uses: actions/upload-artifact@v4
        with:
          name: maven-central-staging-bundle
          path: packages/kotlin/build/staging-repo/

      - name: Live Publish to GitHub Packages
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd packages/kotlin
          ./gradlew publishAllPublicationsToGitHubPackagesRepository --stacktrace || echo "Skipping GitHub Packages publish if unconfigured."

      - name: Live Publish to Maven Central Portal (Sonatype)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        run: |
          if [ -z "$OSSRH_USERNAME" ] || [ -z "$OSSRH_PASSWORD" ]; then
            echo "OSSRH credentials not configured, skipping Sonatype publish."
            exit 0
          fi
          ROOT_DIR=$(pwd)
          cd packages/kotlin/build/staging-repo
          zip -r "$ROOT_DIR/packages/kotlin/build/bundle.zip" .
          cd "$ROOT_DIR"
          AUTH=$(printf "%s:%s" "$OSSRH_USERNAME" "$OSSRH_PASSWORD" | base64 | tr -d '\n\r')
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC" \
            -H "Authorization: Bearer $AUTH" \
            -F "bundle=@$ROOT_DIR/packages/kotlin/build/bundle.zip;type=application/octet-stream")
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "Successfully submitted bundle to Maven Central Portal!"
          else
            echo "Maven Central Portal publish failed with HTTP $STATUS"
            exit 1
          fi

  publish-swift:
    name: Validate & Index Swift Package (SPM / SPI)
    needs: release-please
    timeout-minutes: 10
    if: |
      !failure() && !cancelled() && (
        (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'swift')) ||
        (startsWith(github.ref, 'refs/tags/') && (
          startsWith(github.ref, 'refs/tags/v') ||
          startsWith(github.ref, 'refs/tags/swift-') ||
          contains(github.ref, 'packages/swift')
        )) ||
        needs.release-please.outputs.swift_created == 'true' ||
        contains(needs.release-please.outputs.paths_released, 'packages/swift')
      )
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer 2>/dev/null || sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer 2>/dev/null || sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer 2>/dev/null || true
          swift --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust Core Libraries
        run: |
          ./scripts/build-rust-core.sh

      - name: Build and Test Swift Package
        run: |
          swift build -c release
          swift test

      - name: Validate Swift Package Index Manifest
        run: |
          if [ -f ".spi.yml" ]; then
            echo ".spi.yml found and verified."
          else
            echo "ERROR: .spi.yml missing!"
            exit 1
          fi

  package-rust:
    name: Package & Verify Rust Core (sarvam-rust-core)
    needs: release-please
    timeout-minutes: 10
    if: |
      !failure() && !cancelled() && (
        (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'rust')) ||
        (startsWith(github.ref, 'refs/tags/') && (
          startsWith(github.ref, 'refs/tags/v') ||
          startsWith(github.ref, 'refs/tags/rust-') ||
          contains(github.ref, 'packages/rust-core')
        )) ||
        needs.release-please.outputs.rust_core_created == 'true' ||
        contains(needs.release-please.outputs.paths_released, 'packages/rust-core')
      )
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build and Package Crate
        run: |
          ./scripts/build-rust-core.sh
          cd packages/rust-core
          cargo package --allow-dirty
