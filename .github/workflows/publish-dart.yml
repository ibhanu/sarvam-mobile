name: Publish Dart to pub.dev

on:
  push:
    tags:
      - 'dart-v*'
      - 'dart-audio-v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-dart:
    name: Publish to pub.dev (OIDC)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify OIDC Token Presence
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "ERROR: ACTIONS_ID_TOKEN_REQUEST_URL is not set!"
            exit 1
          fi
          echo "ACTIONS_ID_TOKEN_REQUEST_URL is available."

      - name: Publish Dart Core Package (sarvam)
        if: startsWith(github.ref, 'refs/tags/dart-v')
        run: |
          cd packages/dart/sarvam
          dart pub get
          CURRENT_VER=$(grep '^version:' pubspec.yaml | head -n1 | awk '{print $2}')
          EXISTS=$(curl -s "https://pub.dev/api/packages/sarvam" | jq -r --arg ver "$CURRENT_VER" '.versions[]? | select(.version == $ver) | .version' 2>/dev/null || true)
          if [ "$EXISTS" = "$CURRENT_VER" ]; then
            echo "Version $CURRENT_VER of sarvam is already published on pub.dev. Skipping."
          else
            dart pub publish --force
          fi

      - name: Publish Flutter Companion Audio Package (sarvam_flutter_audio)
        if: startsWith(github.ref, 'refs/tags/dart-audio-v')
        run: |
          cd packages/dart/sarvam_flutter_audio
          flutter pub get
          CURRENT_VER=$(grep '^version:' pubspec.yaml | head -n1 | awk '{print $2}')
          EXISTS=$(curl -s "https://pub.dev/api/packages/sarvam_flutter_audio" | jq -r --arg ver "$CURRENT_VER" '.versions[]? | select(.version == $ver) | .version' 2>/dev/null || true)
          if [ "$EXISTS" = "$CURRENT_VER" ]; then
            echo "Version $CURRENT_VER of sarvam_flutter_audio is already published on pub.dev. Skipping."
          else
            flutter pub publish --force
          fi
